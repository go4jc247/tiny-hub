<style>
  :root{
    --green:#3f7d3a; --green-d:#2b5a28; --green-l:#e6f2dc; --cream:#fffaf0;
    --ink:#2f3a2c; --muted:#6c7a66; --accent:#e9a23b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.55) 0 120px, transparent 121px),
      radial-gradient(circle at 90% 30%, rgba(255,255,255,.35) 0 80px, transparent 81px),
      repeating-linear-gradient(45deg, rgba(63,125,58,.05) 0 14px, transparent 14px 28px),
      linear-gradient(160deg,#dff0cf 0%,#f7f1dc 55%,#f3e2c2 100%);
    background-attachment:fixed;
    min-height:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 110px}
  header{text-align:center;margin:8px 0 18px}
  header svg{width:86px;height:86px}
  h1{font-size:30px;margin:6px 0 4px;color:var(--green-d);letter-spacing:.3px}
  .sub{color:var(--muted);margin:0;font-size:15px}
  .card{
    background:var(--cream);border-radius:20px;padding:18px 18px 16px;margin:14px 0;
    box-shadow:0 6px 20px rgba(60,80,40,.12);border:2px solid #efe4c8;
  }
  .card h2{margin:0 0 12px;font-size:19px;color:var(--green-d);display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .field{flex:1 1 150px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .stepper{display:flex;align-items:center;background:#fff;border-radius:14px;border:2px solid #e3dcc6;overflow:hidden}
  .stepper button{border:0;background:var(--green-l);color:var(--green-d);font-size:22px;width:46px;height:46px;cursor:pointer;font-weight:700}
  .stepper button:active{background:#cfe5bd}
  .stepper input{flex:1;border:0;text-align:center;font-size:20px;font-weight:700;color:var(--ink);width:40px;background:#fff;font-family:inherit}
  select{width:100%;height:50px;border-radius:14px;border:2px solid #e3dcc6;background:#fff;font-size:16px;padding:0 10px;font-family:inherit;color:var(--ink)}
  .summary{margin-top:14px;background:var(--green-l);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45}
  .summary b{color:var(--green-d)}
  .warn{margin-top:10px;background:#fff3dc;border:2px dashed var(--accent);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4}
  ul.ing{list-style:none;padding:0;margin:0}
  ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px dashed #e6dcc0;font-size:16px}
  ul.ing li:last-child{border-bottom:0}
  ul.ing .amt{font-weight:700;color:var(--green-d);white-space:nowrap;text-align:right}
  ol.steps{padding-left:22px;margin:0}
  ol.steps li{margin:0 0 10px;line-height:1.45}
  ol.steps li b{color:var(--green-d)}
  .tips{font-size:14px;line-height:1.5;color:#4b5746}
  .start{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:var(--green);color:#fff;border:0;border-radius:999px;
    padding:16px 28px;font-size:18px;font-weight:800;font-family:inherit;
    box-shadow:0 8px 22px rgba(43,90,40,.35);cursor:pointer;display:flex;align-items:center;gap:10px;
    width:calc(100% - 32px);max-width:420px;justify-content:center;
  }
  .start:active{transform:translateX(-50%) scale(.98)}

  /* Cook mode */
  #cook{
    position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.6) 0 90px, transparent 91px),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.4) 0 110px, transparent 111px),
      repeating-linear-gradient(-45deg, rgba(63,125,58,.06) 0 16px, transparent 16px 32px),
      linear-gradient(180deg,#cfe8bd 0%,#f6efd6 70%,#f1ddb8 100%);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #cook.open{display:flex}
  .cook-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
  .x{border:0;background:rgba(255,255,255,.8);width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--ink)}
  .count{font-weight:800;color:var(--green-d);font-size:15px;background:rgba(255,255,255,.75);padding:8px 14px;border-radius:999px}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 22px;text-align:center;overflow:auto}
  .art{width:min(62vw,300px);height:min(62vw,300px);max-height:38vh;filter:drop-shadow(0 8px 14px rgba(60,80,40,.18));animation:pop .35s ease}
  .stage h3{font-size:clamp(24px,6vw,34px);margin:14px 0 8px;color:var(--green-d)}
  .stage p{font-size:clamp(17px,4.4vw,22px);line-height:1.5;max-width:560px;margin:0;background:rgba(255,250,240,.85);padding:14px 16px;border-radius:18px}
  .stage p b{color:var(--green-d)}

  #splash .wiggle{transform-origin:150px 190px;animation:wiggle 1.6s ease-in-out .9s infinite}
  #splash .arm{transform-origin:212px 140px;animation:wave .5s ease-in-out infinite alternate}
  #splash .drop{animation:fly 1.4s ease-out infinite}
  #splash h2{font-size:clamp(34px,10vw,58px);margin:4px 0 0;color:#fff;letter-spacing:1px;

    animation:pop .5s 1.1s both, pulse2 1.6s 1.6s ease-in-out infinite}

    border:2px solid rgba(255,255,255,.8);background:rgba(43,90,40,.35);color:#fff;font-family:inherit;font-size:14px;font-weight:700;
    padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
  #splash .upd:disabled{opacity:.7}
  #splash .updmsg{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;color:#fff;font-size:14px;font-weight:700;
    text-shadow:0 1px 3px rgba(0,0,0,.4);padding:0 20px}
  #splash .look{animation:look 5s ease-in-out infinite}
  @keyframes look{0%,12%{transform:translate(0,0)}20%,35%{transform:translate(-5px,-4px)}45%,58%{transform:translate(5px,-3px)}68%,80%{transform:translate(3px,4px)}90%,100%{transform:translate(0,0)}}
  @keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes boing{0%{transform:translateY(120vh) scale(.6)}70%{transform:translateY(-12px) scale(1.05)}100%{transform:none}}
  @keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
  @keyframes fly{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
</style>
</head>

const t = k => I18N[LANG][k];

function applyLang(){
  document.documentElement.lang = LANG;
  document.title = t('doc_title');
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = t(el.dataset.i); });
  document.querySelectorAll('.langbtn').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  if (typeof renderInstall === 'function') renderInstall();
  calc();
}
function setLang(l){
  LANG = l; try { localStorage.setItem('pickleLang', l); } catch(e){}
  applyLang();
  if ($('cook').classList.contains('open')) { steps = STEPS(); show(); }

// ---------- amounts per 1 lb of cucumbers ----------
const PER_LB = {
  water: 2,          // cups
  salt: 17.5,        // grams
  vinegar: 1,        // tbsp
  garlic: 3,         // cloves
  mustard: 0.5, coriander: 0.5, dill: 0.5, fenugreek: 0.125,
  allspice: 0.25, pepper: 0.5, flakes: 0.125,   // tsp
  bay: 1, chilies: 1, celery: 0.5               // whole
};
const PICKLES_PER_LB = 4;

const $ = id => document.getElementById(id);
const FR = {0.125:'⅛',0.25:'¼',0.375:'⅜',0.5:'½',0.625:'⅝',0.75:'¾',0.875:'⅞'};
function frac(x, step){
  const r = Math.round(x/step)*step;
  const w = Math.floor(r + 1e-9), f = +(r - w).toFixed(3);
  if (f === 0) return String(w);
  return (w ? w + ' ' : '') + (FR[f] || f);
}
const dec = (x, d=1) => (Math.round(x*10**d)/10**d).toString().replace('.', ',');
function spoon(tsp){
  if (LANG === 'lt'){
    if (tsp < 0.1) return 'žiupsnelis';
    if (tsp >= 3) return frac(tsp/3, 0.25) + ' v. š.';
    return frac(tsp, 0.125) + ' a. š.';
  }
  if (tsp < 0.1) return 'a pinch';
  if (tsp >= 3) return frac(tsp/3, 0.25) + ' tbsp';
  return frac(tsp, 0.125) + ' tsp';
}
function whole(n){ return Math.max(1, Math.ceil(n - 0.01)); }
function ltPlural(n, one, few, many){
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && (b < 10 || b > 20)) return few;
  return many;
}

let A = {}; // current amounts

function calc(){
  const people = Math.max(1, Math.min(50, parseInt($('people').value)||1));
  const days = Math.max(1, Math.min(120, parseInt($('days').value)||1));
  const rate = +$('rate').value; // pickles per person per week
  const totalPickles = Math.ceil(people * days * rate / 7);
  const batches = days > 21 ? Math.ceil(days / 14) : 1;
  const perBatchPickles = Math.ceil(totalPickles / batches);
  const lb = Math.max(1, Math.round(perBatchPickles / PICKLES_PER_LB * 2) / 2);
  const jars = Math.ceil(lb / 2);
  const g = Math.round(PER_LB.salt * lb);
  const n = k => PER_LB[k]*lb;
  A = { people, days, batches, lb, jars, pickles: Math.round(lb*PICKLES_PER_LB),
        bay: whole(n('bay')), chilies: whole(n('chilies')), celery: whole(n('celery')) };
  ['mustard','coriander','dill','fenugreek','allspice','pepper','flakes'].forEach(k => A[k] = spoon(n(k)));
  if (LANG === 'lt'){
    const vin = n('vinegar')*15;
    Object.assign(A, {
      cucumbers: dec(lb*0.4536) + ' kg',
      water: dec(n('water')*0.24) + ' l',
      salt: `${g} g`,
      vinegar: Math.round(vin/5)*5 + ' ml',
      garlic: whole(n('garlic')) + ' skilt.',
      container: (jars === 1 ? '1 × 2 l stiklainis' : `${jars} × 2 l ${ltPlural(jars,'stiklainis','stiklainiai','stiklainių')}`)
               + (lb >= 6 && lb <= 8 ? ' arba 8 l raugimo puodas' : '')
    });
  } else {
    const c = n('water'), tb = n('vinegar');
    Object.assign(A, {
      cucumbers: frac(lb,0.5) + ' lb',
      water: frac(c,0.5) + ' cups' + (c >= 8 ? ` (${frac(c/4,0.5)} qt)` : ''),
      salt: `${g} g (≈ ${frac(g/17.5,0.5)} tbsp Morton kosher)`,
      vinegar: tb >= 16 ? frac(tb/16,0.25) + ' cup' : frac(tb,0.5) + ' tbsp',
      garlic: whole(n('garlic')) + ' cloves',
      container: jars <= 1 ? 'one 2-quart jar'
               : lb >= 6 && lb <= 8 ? `${jars} two-quart jars, or a 2-gallon crock`
               : `${jars} two-quart jars`
    });
  }
  render(totalPickles);
}

function render(total){
  $('summary').innerHTML = t('summary')(A.people, A.days, total) + (A.batches>1 ? t('batches')(A) : t('buy')(A));
  const w = $('warn');
  if (A.batches>1){ w.hidden = false; w.innerHTML = t('warn')(A); } else w.hidden = true;
  $('perbatch').textContent = A.batches>1 ? t('per_batch') : '';
  const amts = [A.cucumbers,A.water,A.salt,A.vinegar,A.garlic,A.mustard,A.coriander,A.dill,A.fenugreek,A.allspice,A.pepper,A.flakes,A.bay,A.chilies,A.celery];
  $('ing').innerHTML = t('ing').map((nm,k)=>`<li><span>${nm}</span><span class="amt">${amts[k]}</span></li>`).join('');
  $('steps').innerHTML = STEPS().slice(0,-1).map(s=>`<li><b>${s.title}.</b> ${s.text}</li>`).join('');
}

function STEPS(){
  const arts = [ART.cuke, ART.brine, ART.spice, ART.pack, ART.weigh,
    ART.ferment.replace('>DAYS<', '>'+t('days_caps')+'<'),
    ART.fridge.replace('>34–38°F<', '>'+t('temp')+'<'), ART.done];
  return t('S')(A).map(([title,text],k)=>({title, text, art:arts[k]}));
}

// ---------- cook mode ----------
let i = 0, steps = [];
function show(){
  const s = steps[i];
  $('stage').innerHTML = `<div class="art">${s.art}</div><h3>${s.title}</h3><p>${s.text}</p>`;
  $('count').textContent = i === steps.length-1 ? t('finished') : t('stepof')(i+1, steps.length-1);
  $('dots').innerHTML = steps.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('');
  $('prevBtn').disabled = i===0;
  $('nextBtn').textContent = i===steps.length-1 ? t('closeb') : (i===steps.length-2 ? t('finish') : t('next'));
}
function open(){
  steps = STEPS(); i = 0; $('cook').classList.add('open'); show();
  const el = document.documentElement;
  try { if (el.requestFullscreen) el.requestFullscreen().catch(()=>{}); } catch(e){}
}
function close(){
  $('cook').classList.remove('open');
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){}
}
function go(d){ if (d>0 && i===steps.length-1) return close(); i = Math.max(0, Math.min(steps.length-1, i+d)); show(); }

$('startBtn').onclick = open;
$('closeBtn').onclick = close;
$('prevBtn').onclick = ()=>go(-1);
$('nextBtn').onclick = ()=>go(1);
document.addEventListener('keydown', e=>{
  if (!$('cook').classList.contains('open')) return;
  if (e.key==='ArrowRight' || e.key===' ') go(1);
  if (e.key==='ArrowLeft') go(-1);
  if (e.key==='Escape') close();
});
let sx=null;
$('cook').addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; }, {passive:true});
$('cook').addEventListener('touchend', e=>{
  if (sx===null) return; const dx = e.changedTouches[0].clientX - sx; sx=null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
});

// ---------- inputs ----------
document.querySelectorAll('.stepper button').forEach(b=>{
  b.onclick = ()=>{ const inp=$(b.dataset.t); inp.value = Math.max(+inp.min, Math.min(+inp.max, (parseInt(inp.value)||0) + +b.dataset.d)); calc(); };
});
['people','days','rate'].forEach(id=>$(id).addEventListener('input', calc));

// ---------- first-run install screen ----------
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isAndroid = /android/i.test(navigator.userAgent);
var PLAT = isAndroid ? 'android' : 'ios';
var deferredPrompt = null;
function renderInstall(){
  $('isteps').innerHTML = t(PLAT==='ios' ? 'i_ios' : 'i_android')
    .map((x,k)=>`<li><span class="n">${k+1}</span><span>${x}</span></li>`).join('');
  document.querySelectorAll('.ptabs button').forEach(b=>b.classList.toggle('on', b.dataset.p===PLAT));
  $('instNow').hidden = !deferredPrompt;
}
$('instIcon').src = $('appleIcon').href;
function openInstall(){ renderInstall(); $('install').classList.add('open'); }
function closeInstall(){ $('install').classList.remove('open'); try{ localStorage.setItem('pickleInstallSeen','1'); }catch(e){} }
document.querySelectorAll('.ptabs button').forEach(b=>b.addEventListener('click',()=>{ PLAT=b.dataset.p; renderInstall(); }));
$('instLater').addEventListener('click', closeInstall);
$('howInstall').addEventListener('click', openInstall);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
$('instNow').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch(e){}
  deferredPrompt = null; closeInstall();
});
window.addEventListener('appinstalled', closeInstall);
let seen = false; try { seen = localStorage.getItem('pickleInstallSeen') === '1'; } catch(e){}
if (isStandalone) $('howInstall').hidden = true;
else if (!seen) openInstall();

// ---------- PWA: offline cache + manual updates only ----------
const SW_FILE = 'half-sour-pickles-sw.js';
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(SW_FILE, { updateViaCache: 'all' }).catch(()=>{});
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

$('updBtn').addEventListener('click', async e => {
  e.stopPropagation();
  const btn = $('updBtn'), msg = $('updmsg');
  const say = k => { msg.textContent = t(k); };
  if (!('serviceWorker' in navigator)) return say('upd_nosw');
  if (!navigator.onLine) return say('upd_offline');
  btn.disabled = true; say('upd_checking');
  try {
    const reg = await navigator.serviceWorker.ready;
    const sw = navigator.serviceWorker.controller || reg.active;
    if (!sw) { say('upd_nosw'); btn.disabled = false; return; }
    try { await reg.update(); } catch(_){}
    const res = await new Promise((resolve, reject) => {
      const ch = new MessageChannel();
      ch.port1.onmessage = ev => resolve(ev.data);
      sw.postMessage({ type: 'check-updates' }, [ch.port2]);
      setTimeout(() => reject(new Error('timeout')), 30000);
    });
    if (res.failed === res.total) say('upd_fail');
    else if (res.changed > 0) { say('upd_done'); setTimeout(() => location.reload(), 900); return; }
    else say('upd_none');
  } catch(err) { say('upd_fail'); }
  btn.disabled = false;
});
</script>
</body>
</html>
