<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AskKai">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AskKai</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f8; --card:#fff; --text:#111; --muted:#666; --accent:#2f6fed; --border:#d8d8de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e11; --card:#1a1a1f; --text:#f2f2f5; --muted:#9a9aa5; --border:#2c2c34; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  textarea, select { width:100%; font:inherit; color:var(--text); background:transparent; border:1px solid var(--border); border-radius:10px; padding:10px; }
  textarea { resize:vertical; }
  #doc { min-height:150px; }
  #q { min-height:70px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:11px 16px; background:var(--accent); color:#fff; width:100%; margin-top:8px; }
  button:disabled { opacity:.45; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #bar { height:8px; background:var(--border); border-radius:6px; overflow:hidden; margin-top:10px; display:none; }
  #fill { height:100%; width:0; background:var(--accent); transition:width .2s; }
  #status { font-size:13px; color:var(--muted); margin-top:8px; white-space:pre-wrap; }
  #answer { white-space:pre-wrap; min-height:60px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
</style>
</head>
<body>
<h1>AskKai <span style="font-weight:400;color:var(--muted);font-size:13px">on-device</span></h1>

<div class="card">
  <label for="model">Model</label>
  <select id="model">
    <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 1.5B (~1 GB, fast)</option>
    <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 2B (~1.5 GB)</option>
    <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B (~2 GB, smarter)</option>
  </select>
  <button id="load">Download / Load model</button>
  <div id="bar"><div id="fill"></div></div>
  <div id="status">Model not loaded. First time: use Wi-Fi.</div>
</div>

<div class="card">
  <label for="doc">1. Paste your document (invoice, notes, etc.)</label>
  <textarea id="doc" placeholder="Paste text here..."></textarea>
  <div class="row">
    <button id="scan" class="secondary">📷 Scan with camera</button>
    <button id="clear" class="secondary">Clear</button>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="pic" type="file" accept="image/*" hidden>
  <button id="fromPhotos" class="secondary">🖼 Pick from photos</button>
  <div id="ocrStatus" style="font-size:13px;color:var(--muted);margin-top:8px"></div>
</div>

<div class="card">
  <label for="q">2. Ask Kai a question</label>
  <textarea id="q" placeholder="e.g. What is the total and due date?"></textarea>
  <label for="len" style="margin-top:10px">Answer length</label>
  <select id="len">
    <option value="short">Short (1-2 sentences)</option>
    <option value="medium" selected>Medium (short paragraph)</option>
    <option value="long">No limit</option>
  </select>
  <button id="ask" disabled>Ask</button>
  <button id="stop" style="display:none;background:#d33">⏹ Stop</button>
</div>

<div class="card">
  <label>Conversation</label>
  <div id="answer"></div>
  <button id="newchat" class="secondary">New chat</button>
</div>

<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";

const $ = id => document.getElementById(id);
const statusEl = $("status"), bar = $("bar"), fill = $("fill");
let engine = null, busy = false;

// Service worker (lets the app open offline)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./AskKai-sw.js").catch(e => console.warn("SW failed", e));
}

// Ask iOS to keep our storage (so the model isn't cleared)
(async () => {
  try {
    if (navigator.storage?.persist) await navigator.storage.persist();
  } catch {}
})();

// Remember choices
try {
  const m = localStorage.getItem("model"); if (m) $("model").value = m;
  $("doc").value = localStorage.getItem("doc") || "";
} catch {}
$("doc").addEventListener("input", () => { try { localStorage.setItem("doc", $("doc").value); } catch {} });
// ---------- On-device OCR (Tesseract.js, runs fully on the phone) ----------
let ocrWorker = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src; el.onload = res; el.onerror = () => rej(new Error("Couldn't load OCR engine (first use needs Wi-Fi)"));
    document.head.appendChild(el);
  });
}
async function getOcr() {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  ocrWorker = await Tesseract.createWorker("eng", 1, {
    workerPath: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
    corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0",
    langPath: "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int",
    logger: m => {
      if (m.status) $("ocrStatus").textContent = "OCR: " + m.status + (m.progress ? " " + Math.round(m.progress * 100) + "%" : "");
    }
  });
  return ocrWorker;
}
async function shrink(file, maxSide = 2000) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
async function runOcr(file) {
  if (!file) return;
  $("ocrStatus").textContent = "OCR: preparing...";
  try {
    const img = await shrink(file);
    const w = await getOcr();
    const { data } = await w.recognize(img);
    const text = (data.text || "").trim();
    const cur = $("doc").value.trim();
    $("doc").value = cur ? cur + "\n\n" + text : text;
    try { localStorage.setItem("doc", $("doc").value); } catch {}
    $("ocrStatus").textContent = text ? "Done. Text added above - check it for mistakes." : "No text found. Try better light and hold steady.";
  } catch (e) {
    $("ocrStatus").textContent = "OCR failed: " + (e.message || e);
  }
}
$("scan").onclick = () => $("cam").click();
$("fromPhotos").onclick = () => $("pic").click();
$("cam").onchange = e => { runOcr(e.target.files[0]); e.target.value = ""; };
$("pic").onchange = e => { runOcr(e.target.files[0]); e.target.value = ""; };

$("clear").onclick = () => { $("doc").value = ""; try { localStorage.removeItem("doc"); } catch {} };

if (!navigator.gpu) {
  statusEl.textContent = "WebGPU isn't available in this browser. On iPhone, update iOS and open from Safari / the home screen app.";
  $("load").disabled = true;
}

$("load").onclick = async () => {
  const model = $("model").value;
  try { localStorage.setItem("model", model); } catch {}
  $("load").disabled = true; $("ask").disabled = true;
  bar.style.display = "block"; fill.style.width = "0%";
  statusEl.textContent = "Loading " + model + "...";
  try {
    if (engine) { try { await engine.unload(); } catch {} engine = null; }
    engine = await webllm.CreateMLCEngine(model, {
      initProgressCallback: p => {
        fill.style.width = Math.round((p.progress || 0) * 100) + "%";
        statusEl.textContent = p.text || "";
      }
    });
    statusEl.textContent = "Ready. Works offline now.";
    bar.style.display = "none";
    $("ask").disabled = false;
  } catch (e) {
    statusEl.textContent = "Load failed: " + (e.message || e) + "\nTry a smaller model or close other apps.";
  }
  $("load").disabled = false;
};

let stopped = false;
$("stop").onclick = () => { stopped = true; try { engine.interruptGenerate(); } catch {} };
let history = [];           // [{role, content}, ...] previous questions and answers
const LENGTHS = {
  short:  { tokens: 150,  rule: "Answer in one or two sentences only." },
  medium: { tokens: 450,  rule: "Answer in one short paragraph." },
  long:   { tokens: null, rule: "Give a thorough, detailed answer." }
};
try { const l = localStorage.getItem("len"); if (l && LENGTHS[l]) $("len").value = l; } catch {}
$("len").onchange = () => { try { localStorage.setItem("len", $("len").value); } catch {} };
const INPUT_BUDGET_CHARS = 9000; // ~2600 tokens of input so everything fits in a 4096 window

function addTurn(label, text) {
  const d = document.createElement("div");
  d.style.marginBottom = "12px";
  const b = document.createElement("div");
  b.style.cssText = "font-size:12px;color:var(--muted);margin-bottom:2px";
  b.textContent = label;
  const t = document.createElement("div");
  t.textContent = text;
  d.append(b, t);
  $("answer").appendChild(d);
  return t;
}

$("newchat").onclick = () => { history = []; $("answer").textContent = ""; };

$("ask").onclick = async () => {
  if (!engine || busy) return;
  let doc = $("doc").value.trim();
  const q = $("q").value.trim();
  if (!q) return;
  busy = true; stopped = false; $("ask").style.display = "none"; $("stop").style.display = "block";

  let note = "";
  if (doc.length > INPUT_BUDGET_CHARS - 1500) {
    doc = doc.slice(0, INPUT_BUDGET_CHARS - 1500);
    note = "\n(Note: the document was too long, so only the first part was read.)";
  }
  const sys = { role: "system", content:
    "You are Kai, a helpful assistant. Answer questions about the document below. Use only the document. " + LENGTHS[$("len").value].rule + "  If the answer isn't in the document, say so. Quote numbers exactly as written.\n\nDOCUMENT:\n" + (doc || "(none provided)") };

  // keep as many recent turns as fit
  const msgs = [...history, { role: "user", content: q }];
  const size = m => m.reduce((n, x) => n + x.content.length, 0);
  while (msgs.length > 1 && size(msgs) + sys.content.length > INPUT_BUDGET_CHARS) msgs.splice(0, 2);

  addTurn("You", q);
  $("q").value = "";
  const out = addTurn("Kai", "…");
  let text = "", finish = null;
  try {
    const stream = await engine.chat.completions.create({
      messages: [sys, ...msgs], stream: true, temperature: 0.3, ...(LENGTHS[$("len").value].tokens ? { max_tokens: LENGTHS[$("len").value].tokens } : {})
    });
    for await (const chunk of stream) {
      text += chunk.choices[0]?.delta?.content || "";
      finish = chunk.choices[0]?.finish_reason || finish;
      out.textContent = text;
    }
    if (stopped) out.textContent = text + "\n\n[Stopped]";
    else if (finish === "length" && LENGTHS[$("len").value].tokens) out.textContent = text + "\n\n[Answer hit the length limit. Type \"continue\" or pick No limit.]";
    else if (finish === "length") out.textContent = text + "\n\n[Reached the model's memory limit. Type \"continue\" to keep going.]";
    else if (note) out.textContent = text + note;
  } catch (e) {
    out.textContent = text ? text + "\n\n[Stopped: reached the model's memory limit. Type \"continue\" to keep going.]" : "Error: " + (e.message || e);
  }
  if (text) { if (history[history.length-1]?.content !== text) history.push({ role: "user", content: q }, { role: "assistant", content: text }); }
  busy = false; $("stop").style.display = "none"; $("ask").style.display = "block"; $("ask").disabled = false;
};
</script>
</body>
</html>
